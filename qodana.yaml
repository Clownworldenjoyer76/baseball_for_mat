version: "1.0"
linter: qodana-python

profile:
  name: qodana.recommended

onlyDirectory: docs/win/baseball/mlb

bootstrap: |
  python -m pip install --upgrade pip
  python -m pip install -r docs/win/baseball/mlb/requirements.txt
  python -m pip install playwright
  python -m pip install -e docs/win/baseball/mlb/vendor/sportsdataverse -c docs/win/baseball/mlb/requirements.txt
  python -m pip check

include:
  - name: CheckDependencyLicenses

exclude:
  - name: All
    paths:
      - docs/win/baseball/mlb/vendor
      - docs/win/baseball/mlb/00_intake/sportsdataverse/cache
