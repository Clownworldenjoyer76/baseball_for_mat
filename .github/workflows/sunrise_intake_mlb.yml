name: _Sunrise MLB 02 Intake

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Date to run/scrape (YYYY-MM-DD). Defaults to today."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  baseball-intake:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Resolve target date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            echo "TARGET_DATE=${{ github.event.inputs.date }}" >> "$GITHUB_ENV"
            echo "DATE=$(echo '${{ github.event.inputs.date }}' | tr '-' '_')" >> "$GITHUB_ENV"
          else
            echo "TARGET_DATE=$(TZ='America/New_York' date +'%Y-%m-%d')" >> "$GITHUB_ENV"
            echo "DATE=$(TZ='America/New_York' date +'%Y_%m_%d')" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pandas requests
          python -m pip install playwright pytz

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright system deps
        run: python -m playwright install-deps chromium

      - name: Install Playwright browsers
        run: python -m playwright install chromium

      - name: Create output directories
        run: |
          mkdir -p docs/win/baseball/00_intake/sportsbook/
          mkdir -p docs/win/baseball/00_intake/drat_raw/
          mkdir -p docs/win/baseball/mlb/00_intake/drat_raw/
          mkdir -p docs/win/baseball/00_intake/predictions/
          mkdir -p docs/win/baseball/00_intake/predictions/pred_with_game_id/
          mkdir -p docs/win/baseball/00_intake/predictions/pred_with_game_id/rejections/
          mkdir -p docs/win/baseball/00_intake/games/
          mkdir -p docs/win/baseball/00_intake/mlb_raw/
          mkdir -p docs/win/baseball/errors/00_intake/
          mkdir -p docs/win/baseball/mlb/errors/00_intake/
          mkdir -p docs/win/baseball/maps/no_map/
          mkdir -p docs/win/baseball/data/
          mkdir -p docs/win/baseball/data/weather/
          mkdir -p docs/win/baseball/data/weather/metno_raw/

      - name: Baseball Odds Parse
        run: python docs/win/baseball/scripts/00_intake/odds_parse.py docs/win/baseball/odds/${DATE}.json

      - name: Baseball Name Normalization Pre
        run: python docs/win/baseball/scripts/00_intake/name_normalization.py

      - name: Baseball Scraper
        run: python docs/win/baseball/scripts/00_intake/baseball_drat_scraper.py

      - name: Baseball Scraper ALT
        run: python docs/win/baseball/mlb/scripts/00_intake/baseball_drat_scraper.py

      - name: Baseball Transform
        run: python docs/win/baseball/scripts/00_intake/transform_baseball.py

      - name: Baseball Name Normalization Post
        run: python docs/win/baseball/scripts/00_intake/name_normalization.py

      - name: Baseball Scrape MLB Raw
        run: python docs/win/baseball/scripts/00_intake/scrape_mlb_raw.py "$TARGET_DATE"

      - name: Baseball Build Games List
        run: python docs/win/baseball/scripts/00_intake/build_games_list.py

      - name: Baseball Fetch Park Weather
        env:
          METNO_USER_AGENT: "MatsPicksWeather/1.0 local-dev"
        run: python docs/win/baseball/scripts/00_intake/fetch_park_weather.py

      - name: Baseball Build Game Weather
        run: python docs/win/baseball/scripts/00_intake/build_game_weather.py

      - name: Baseball Enrich Game Context
        run: python docs/win/baseball/scripts/00_intake/enrich_game_context.py

      - name: Baseball Inject Game IDs Into Predictions
        run: python docs/win/baseball/scripts/00_intake/game_id_pred.py

      - name: Print intake failure diagnostics
        if: failure()
        run: |
          echo "=== docs/win/baseball/errors/00_intake ==="
          find docs/win/baseball/errors/00_intake -maxdepth 1 -type f -print || true

          echo ""
          echo "=== build_games_list log ==="
          if [ -f docs/win/baseball/errors/00_intake/build_games_list.txt ]; then
            cat docs/win/baseball/errors/00_intake/build_games_list.txt
          else
            echo "build_games_list.txt not found"
          fi

          echo ""
          echo "=== game_id_pred log ==="
          if [ -f docs/win/baseball/errors/00_intake/game_id_pred.txt ]; then
            cat docs/win/baseball/errors/00_intake/game_id_pred.txt
          else
            echo "game_id_pred.txt not found"
          fi

          echo ""
          echo "=== enrich_game_context log ==="
          if [ -f docs/win/baseball/errors/00_intake/enrich_game_context.txt ]; then
            cat docs/win/baseball/errors/00_intake/enrich_game_context.txt
          else
            echo "enrich_game_context.txt not found"
          fi

          echo ""
          echo "=== target-date input/output files ==="
          find docs/win/baseball/00_intake -type f -name "${DATE}*" -print || true

          echo ""
          echo "=== prediction rejection CSVs ==="
          find docs/win/baseball/00_intake/predictions/pred_with_game_id/rejections -type f -name "*.csv" -print -exec cat {} \; || true

      - name: Upload intake diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseball-intake-diagnostics-${{ env.DATE }}
          if-no-files-found: ignore
          path: |
            docs/win/baseball/errors/00_intake/**
            docs/win/baseball/00_intake/sportsbook/**
            docs/win/baseball/00_intake/drat_raw/**
            docs/win/baseball/00_intake/mlb_raw/**
            docs/win/baseball/00_intake/predictions/pred_with_game_id/rejections/**
            docs/win/baseball/00_intake/predictions/pred_with_game_id/**
            docs/win/baseball/00_intake/games/**
            docs/win/baseball/00_intake/predictions/**
            docs/win/baseball/data/**
            docs/win/baseball/mlb/00_intake/drat_raw/**
            docs/win/baseball/mlb/errors/00_intake/**

      - name: Commit outputs
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A docs/win/baseball/
          git add -A docs/win/baseball/maps/no_map

          git status --short

          git diff --cached --quiet || git commit -m "chore: baseball intake run $(date -u +'%Y-%m-%d %H:%M UTC')"

          git status --short

          git push
