name: Final Scores MLB

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-scores-mlb-${{ github.ref }}
  cancel-in-progress: false

jobs:
  MLB_Post_Game_Final_Scores:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Sync selected branch
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create MLB output directories
        run: |
          mkdir -p docs/win/baseball/mlb/05_final_scores/results/final_scores
          mkdir -p docs/win/baseball/mlb/05_final_scores/results/graded/daily
          mkdir -p docs/win/baseball/mlb/05_final_scores/results/unmatched
          mkdir -p docs/win/baseball/mlb/05_final_scores/results/audit
          mkdir -p docs/win/baseball/mlb/05_final_scores/intermediate
          mkdir -p docs/win/baseball/mlb/05_final_scores/reports/overview
          mkdir -p docs/win/baseball/mlb/05_final_scores/reports/moneyline
          mkdir -p docs/win/baseball/mlb/05_final_scores/reports/run_line
          mkdir -p docs/win/baseball/mlb/05_final_scores/reports/totals
          mkdir -p docs/win/baseball/mlb/errors/05_final_scores

      - name: Build MLB final scores
        run: |
          python docs/win/baseball/mlb/scripts/05_final_scores/build_mlb_final_scores.py || {
            echo ""
            echo "===== MLB FINAL SCORE BUILD LOGS ====="
            find docs/win/baseball/mlb/errors/05_final_scores \
              -maxdepth 1 \
              -type f \
              -print \
              -exec sed -n '1,260p' {} \;

            echo ""
            echo "===== MLB FINAL SCORE BUILD AUDIT PREVIEW ====="
            find docs/win/baseball/mlb/05_final_scores/results/audit \
              -maxdepth 1 \
              -type f \
              -print \
              -exec sh -c \
                'echo "ROWS: $(($(wc -l < "$1") - 1))"; echo "HEAD:"; sed -n "1,26p" "$1"' \
                sh {} \;

            exit 1
          }

      - name: Normalize MLB final-score team names
        run: |
          python docs/win/baseball/mlb/scripts/05_final_scores/normalize_final_score_mlb_names.py || {
            echo ""
            echo "===== FINAL SCORE TEAM NORMALIZATION LOGS ====="
            find docs/win/baseball/mlb/errors/05_final_scores \
              -maxdepth 1 \
              -type f \
              -print \
              -exec sed -n '1,260p' {} \;

            exit 1
          }

      - name: Normalize MLB results
        run: |
          python docs/win/baseball/mlb/scripts/05_final_scores/normalize_mlb_results.py || {
            echo ""
            echo "===== MLB RESULTS NORMALIZATION LOGS ====="
            find docs/win/baseball/mlb/errors/05_final_scores \
              -maxdepth 1 \
              -type f \
              -print \
              -exec sed -n '1,260p' {} \;

            exit 1
          }

      - name: Grade MLB bets
        run: |
          python docs/win/baseball/mlb/scripts/05_final_scores/01_mlb_results_grade.py || {
            echo ""
            echo "===== MLB GRADING LOGS ====="
            find docs/win/baseball/mlb/errors/05_final_scores \
              -maxdepth 1 \
              -type f \
              -print \
              -exec sed -n '1,260p' {} \;

            echo ""
            echo "===== MLB UNMATCHED SELECTED BETS PREVIEW ====="
            UNMATCHED_FILE="docs/win/baseball/mlb/05_final_scores/results/unmatched/MLB_unmatched_selected_bets.csv"

            if [ -f "$UNMATCHED_FILE" ]; then
              echo "ROWS: $(($(wc -l < "$UNMATCHED_FILE") - 1))"
              sed -n '1,26p' "$UNMATCHED_FILE"
            else
              echo "No unmatched selected bets file found."
            fi

            echo ""
            echo "===== MLB AUDIT PREVIEW ====="
            find docs/win/baseball/mlb/05_final_scores/results/audit \
              -maxdepth 1 \
              -type f \
              -print \
              -exec sh -c \
                'echo "ROWS: $(($(wc -l < "$1") - 1))"; echo "HEAD:"; sed -n "1,26p" "$1"' \
                sh {} \;

            exit 1
          }

      - name: Analyze MLB results
        run: |
          python docs/win/baseball/mlb/scripts/05_final_scores/02_mlb_results_analyze.py || {
            echo ""
            echo "===== MLB ANALYSIS LOGS ====="
            find docs/win/baseball/mlb/errors/05_final_scores \
              -maxdepth 1 \
              -type f \
              -print \
              -exec sed -n '1,260p' {} \;

            exit 1
          }

      - name: Generate MLB reports
        run: |
          python docs/win/baseball/mlb/scripts/05_final_scores/03_mlb_results_reports.py || {
            echo ""
            echo "===== MLB REPORT LOGS ====="
            find docs/win/baseball/mlb/errors/05_final_scores \
              -maxdepth 1 \
              -type f \
              -print \
              -exec sed -n '1,260p' {} \;

            echo ""
            echo "===== MLB AUDIT PREVIEW ====="
            find docs/win/baseball/mlb/05_final_scores/results/audit \
              -maxdepth 1 \
              -type f \
              -print \
              -exec sh -c \
                'echo "ROWS: $(($(wc -l < "$1") - 1))"; echo "HEAD:"; sed -n "1,26p" "$1"' \
                sh {} \;

            exit 1
          }

      - name: Print final MLB audit summaries
        if: always()
        run: |
          echo ""
          echo "===== MLB FINAL SCORE ERROR LOGS ====="
          find docs/win/baseball/mlb/errors/05_final_scores \
            -maxdepth 1 \
            -type f \
            -print \
            -exec sed -n '1,260p' {} \; || true

          echo ""
          echo "===== MLB FINAL SCORE AUDIT FILES ====="
          find docs/win/baseball/mlb/05_final_scores/results/audit \
            -maxdepth 1 \
            -type f \
            -print \
            -exec sh -c \
              'echo "ROWS: $(($(wc -l < "$1") - 1))"; echo "HEAD:"; sed -n "1,26p" "$1"' \
              sh {} \; || true

          echo ""
          echo "===== MLB UNMATCHED FILES ====="
          find docs/win/baseball/mlb/05_final_scores/results/unmatched \
            -maxdepth 1 \
            -type f \
            -print \
            -exec sh -c \
              'echo "ROWS: $(($(wc -l < "$1") - 1))"; echo "HEAD:"; sed -n "1,26p" "$1"' \
              sh {} \; || true

      - name: Reject changes outside MLB directory
        run: |
          OUTSIDE_CHANGES="$(
            git status --porcelain |
            awk '
              {
                path = substr($0, 4)
                if (path ~ / -> /) {
                  split(path, paths, " -> ")
                  path = paths[2]
                }
                if (path !~ /^docs\/win\/baseball\/mlb\//) {
                  print $0
                }
              }
            '
          )"

          if [ -n "$OUTSIDE_CHANGES" ]; then
            echo "The workflow changed files outside docs/win/baseball/mlb/:"
            echo "$OUTSIDE_CHANGES"
            exit 1
          fi

          echo "All generated changes are confined to docs/win/baseball/mlb/."

      - name: Commit MLB outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- docs/win/baseball/mlb/

          if git diff --cached --quiet; then
            echo "No MLB output changes to commit."
            exit 0
          fi

          git commit -m "chore: MLB post-game final scores $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"