name: MLB Full Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-full-pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mlb-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Sync selected branch
        run: git pull --rebase origin "${GITHUB_REF_NAME}"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy scipy pyyaml

      - name: Run merge intake
        run: |
          python docs/win/baseball/mlb/scripts/01_merge/merge_intake.py

      - name: Build juice files
        run: |
          python docs/win/baseball/mlb/scripts/01_merge/build_juice_files.py

      - name: Apply moneyline juice
        run: |
          python docs/win/baseball/mlb/scripts/02_juice/apply_moneyline_juice.py

      - name: Apply run-line juice
        run: |
          python docs/win/baseball/mlb/scripts/02_juice/apply_run_line_juice.py

      - name: Apply total juice
        run: |
          python docs/win/baseball/mlb/scripts/02_juice/apply_total_juice.py

      - name: Compute edges
        run: |
          python docs/win/baseball/mlb/scripts/03_edges/compute_edges.py

      - name: Compute EV and Kelly
        run: |
          python docs/win/baseball/mlb/scripts/03_edges/compute_ev_kelly.py

      - name: Select bets
        run: |
          python docs/win/baseball/mlb/scripts/04_select/baseball_select_bets.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- docs/win/baseball/mlb

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi

          git commit -m "Update MLB pipeline outputs"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
