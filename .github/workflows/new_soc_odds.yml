name: New Soccer Odds

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional date (YYYY-MM-DD or YYYY_MM_DD). Blank uses today in America/New_York."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: new-soccer-odds
  cancel-in-progress: false

jobs:
  soccer-odds:
    runs-on: ubuntu-latest

    env:
      TZ: America/New_York
      RUN_DATE: ${{ inputs.date }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create intake directories
        run: |
          mkdir -p docs/win/soccer/00_intake/sportsbook/normalized
          mkdir -p docs/win/soccer/00_intake/predictions/normalized
          mkdir -p docs/win/soccer/errors/00_intake
          mkdir -p docs/win/soccer/mappings/no_map

      - name: Run soccer odds intake
        shell: bash
        run: |
          args=(--verbose)
          if [[ -n "${RUN_DATE}" ]]; then
            args+=(--date "${RUN_DATE}")
          fi
          python docs/win/soccer/scripts/00_intake/soccer_odds.py "${args[@]}"

      - name: Normalize soccer names
        run: python docs/win/soccer/scripts/00_intake/name_normalization.py

      - name: Normalize sportsbook and predictions
        run: python docs/win/soccer/scripts/00_intake/soccer_cleaner.py

      - name: Show normalized outputs
        run: |
          echo "=== Raw sportsbook CSVs ==="
          find docs/win/soccer/00_intake/sportsbook \
            -mindepth 2 -maxdepth 2 -type f -name "*_soccer.csv" -print | sort

          echo "=== Normalized sportsbook CSVs ==="
          find docs/win/soccer/00_intake/sportsbook/normalized \
            -maxdepth 1 -type f -name "*.csv" -print | sort

          echo "=== Normalized prediction CSVs ==="
          find docs/win/soccer/00_intake/predictions/normalized \
            -maxdepth 1 -type f -name "*.csv" -print | sort

      - name: Commit soccer odds and normalized intake outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/soccer/00_intake/sportsbook/
          git add docs/win/soccer/00_intake/predictions/normalized/
          git add docs/win/soccer/errors/00_intake/name_normalization.txt
          git add docs/win/soccer/errors/00_intake/soccer_cleaner.txt
          git add docs/win/soccer/mappings/no_map/

          if git diff --cached --quiet; then
            echo "No soccer odds or normalized intake changes to commit."
          else
            git commit -m "Update soccer odds and normalized intake outputs"
            git pull --rebase --autostash origin main
            git push origin main
          fi
