# docs/win/baseball/mlb/config/markets_AM.yaml

markets:
  mlb:
    # ── Context / Environment Settings ──────────────────────────
    #
    # rain_exclude_on_will_it_rain:
    #   true  = exclude outdoor/weather-applicable games when will_it_rain == 1
    #   false = do not exclude from will_it_rain
    #
    # rain_exclude_on_symbol_code:
    #   true  = exclude outdoor/weather-applicable games when symbol_code contains
    #           one of rain_symbol_terms
    #   false = do not exclude from symbol_code terms
    #
    # Step 5 separates these controls so false on will_it_rain does not
    # accidentally leave symbol-code rain filtering enabled.
    rain_exclude_on_will_it_rain: false
    rain_exclude_on_symbol_code: false

    rain_symbol_terms:
      - rain
      - heavyrain
      - lightrain
      - sleet
      - snow
      - thunder

    # Set false to allow more totals through even when one/both SP samples are low.
    sp_sample_exclude_totals: false

    # Flag only. Does not exclude bets.
    lineup_low_sample_warn: 4

    # Morning selector allows any number of found batters or starting pitchers.
    context_data_filters:
      enabled: false
      home_batters_found_min: 0
      away_batters_found_min: 0
      home_sp_found_required: 0
      away_sp_found_required: 0

###################################################
## pick_preference supports:
##   best_ev — select the qualifying side with the highest EV.
##   best_prob — select the qualifying side with the highest model probability.
##   all — select every qualifying side. [only moneyline and totals]
    ###################################################
    # ── Moneyline ────────────────────────────────────
    ###################################################

    moneyline:
      enabled: true

      # Allow both sides to be selected if they pass.
      pick_preference: best_prob

      home:
        enabled: true

        odds_bands:
          - [-109, 1000]

        ev_bands:
          - [0.00, 99.99]

        kelly_bands:
          - [0.00, 99.99]

        prob_bands:
          - [0.55, 0.649]

      away:
        enabled: true

        odds_bands:
          - [-1000, -109]
          - [200, 1000]

        ev_bands:
          - [0.00, 99.99]

        kelly_bands:
          - [0.00, 99.99]

        prob_bands:
          - [0.60, 0.699]

    ###################################################
    # ── Run Line ─────────────────────────────────────
    ###################################################

    run_line:
      enabled: true

      # Selector requires best_ev for run line.
      # At most one run-line side is selected per game.
      pick_preference: best_prob

      home:
        enabled: true

        line_bands:
          - [-1.5, -1.5]
          - [1.5, 1.5]

        odds_bands:
          - [-1000, 1000]

        ev_bands:
          - [-10.00, 99.99]

        kelly_bands:
          - [-10.00, 99.99]

        prob_bands:
          - [0.65, 0.799]

      away:
        enabled: true

        line_bands:
          - [-1.5, -1.5]
          - [1.5, 1.5]

        odds_bands:
          - [-1000, 1000]

        ev_bands:
          - [-10.00, 99.99]

        kelly_bands:
          - [-10.00, 99.99]

        prob_bands:
          - [0.75, 1.00]

    ###################################################
    # ── Totals ───────────────────────────────────────
    ###################################################

    total:
      enabled: true

      # Allow both over and under if they pass.
      pick_preference: best_prob

      over:
        enabled: true

        line_bands:
          - [0.0, 7.9]

        odds_bands:
          - [-109, -101]

        ev_bands:
          - [-10.00, 99.99]

        kelly_bands:
          - [-10.00, 99.99]

        prob_bands:
          - [0.55, 0.749]

      under:
        enabled: true

        line_bands:
          - [7.0, 8.9]
          - [12.0, 20.0]

        odds_bands:
          - [-1000, 101]

        ev_bands:
          - [0.10, 99.99]

        kelly_bands:
          - [-10.00, 99.99]

        prob_bands:
          - [0.50, 0.599]
          - [0.80, 0.99]
